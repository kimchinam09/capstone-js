<!DOCTYPE html>
<html lang='vi'>
  <head>
    <meta charset='UTF-8' />
    <meta name='viewport' content='width=device-width, initial-scale=1.0' />
    <meta name='description' content='Chọn khu vực sử dụng CyberStore' />
    <title>CyberStore - Chọn khu vực</title>
    <link rel='preconnect' href='https://fonts.googleapis.com' />
    <link rel='preconnect' href='https://fonts.gstatic.com' crossorigin />
    <link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet' />
    <link rel='stylesheet' href='./assets/css/main.css' />
  </head>
  <body class='landing-page'>
    <main class='landing-main'>
      <section class='landing-content' aria-labelledby='landingTitle'>
        <a class='brand landing-brand' href='./index.html'>
          <span class='brand-icon'>P</span>
          <span>CyberStore</span>
        </a>
         
       

        <div class='landing-options'>
          <a class='landing-option customer-option' href='./customer/customer.html'>
            <span class='landing-option-icon' aria-hidden='true'>🛍️</span>
            <span>
              <strong>Trang khách hàng</strong>
              <small>Xem sản phẩm và quản lý giỏ hàng</small>
            </span>
            <span class='landing-arrow' aria-hidden='true'>›</span>
          </a>

          <a class='landing-option admin-option' href='./admin/admin.html'>
            <span class='landing-option-icon' aria-hidden='true'>⚙️</span>
            <span>
              <strong>Trang quản trị</strong>
              <small>Trang quản lý sản phẩm </small>
            </span>
            <span class='landing-arrow' aria-hidden='true'>›</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
